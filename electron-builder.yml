appId: com.mailchat.app
productName: Mail Chat
directories:
  output: dist
files:
  - out/**/*
  - resources/**/*
  - package.json
asar: true
npmRebuild: false
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
mac:
  icon: resources/icon-mac.png
  category: public.app-category.productivity
  target:
    - dmg
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
publish:
  provider: github
  owner: Omar2-8
  repo: mail-chat
